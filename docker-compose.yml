services:
  gateway:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8082"
    expose:
      - "8082"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
